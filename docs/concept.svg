<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#10151d"/>

  <!-- faint map "grid / roads" -->
  <g stroke="#1d2836" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="90" y1="0" x2="90" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="440" y1="0" x2="440" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/>
  </g>
  <g stroke="#182335" stroke-width="6" stroke-linecap="round" opacity="0.5">
    <path d="M 30 120 C 120 140 150 90 230 110"/>
    <path d="M 60 330 C 150 300 300 320 420 300"/>
    <path d="M 300 30 C 320 90 300 150 380 170"/>
  </g>

  <text x="20" y="35" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Amap Route Growth Animation</text>
  <text x="20" y="60" fill="#9fb3c8" font-family="sans-serif" font-size="13">Satellite map · gray route ghost · green line grows behind the car</text>

  <!-- full route (gray ghost) -->
  <path d="M 80 320 L 130 300 L 180 310 L 240 280 L 300 290 L 360 240 L 420 250 L 480 210 L 540 190"
        stroke="#6b7a88" stroke-opacity="0.5" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- grown route (green, solid) -->
  <path d="M 80 320 L 130 300 L 180 310 L 240 280 L 300 290 L 360 240 L 420 250"
        stroke="#22c55e" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 80 320 L 130 300 L 180 310 L 240 280 L 300 290 L 360 240 L 420 250"
        stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" fill="none" stroke-linecap="round"
        marker-end="url(#arrow)"/>

  <!-- car arrow -->
  <g transform="translate(420, 242)">
    <path d="M 0 -18 L 11 16 L 0 11 L -11 16 Z" fill="#ff4d3a" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="0" cy="4" r="2.6" fill="#fff"/>
  </g>

  <!-- start / end -->
  <circle cx="80" cy="320" r="9" fill="#15a46c" stroke="#fff" stroke-width="2"/>
  <text x="80" y="352" fill="#7dffb0" font-family="sans-serif" font-size="12" text-anchor="middle">Start</text>
  <rect x="476" y="172" width="70" height="24" rx="12" fill="#e53935"/>
  <text x="511" y="189" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">End</text>

  <!-- caption -->
  <text x="320" y="382" fill="#6b7a88" font-family="sans-serif" font-size="12" text-anchor="middle">The green route grows behind the red car as it drives</text>
</svg>
